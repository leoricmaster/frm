# 智能挖机统一代码管理体系 — 本地原型验证环境
# 对应设计文档：docs/design/2026-08-31-excavator-code-management-design.md
# 模拟场景：机房构建区（无 DLP agent、无 VPN），仅本机网络可达
# 镜像：极狐 GitLab（官方中国发行版，免费版档；版本对齐上游——CE 19.3.1 → 19.3.1-jh.0，见 ADR-0021）
#
# 端口规划（避开本机已占用的 8080/9000/9001）：
#   8081 -> GitLab Web (HTTP)
#   8082 -> GitLab SSH (git clone ssh://git@host:8082/...)
#   8083 -> GitLab container registry（本原型暂未启用，预留）
#
# 启动：docker compose up -d
# 停止并彻底清理：docker compose down -v && sudo rm -rf ./config ./logs ./data

name: frm-gitlab

services:
  gitlab:
    # 极狐 GitLab 免费版档运行（ADR-0021）：国产化合规 + 本地支持 + 原生中文界面；
    # 免费档功能与 CE 等价（托管/MR/保护分支/CI/package registry），升级=注入 license
    image: registry.gitlab.cn/omnibus/gitlab-jh:19.3.1-jh.0
    container_name: frm-gitlab
    restart: unless-stopped
    hostname: gitlab.local
    # 资源上限见 deploy 块，口径=设计 §7 生产主机 8C/16G（四容器合计 8C/12.5G，留 OS 余量）；
    # 组件表准绳见 docs/tutorials/ops.html#arch，原型机 62G/32C 富余不受影响
    shm_size: "256m"
    environment:
      # external_url 决定 GitLab 生成的 clone 地址与页面链接，用宿主机 IP + 8081
      GITLAB_ROOT_PASSWORD: "Excavator#2026Proto"
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://10.66.35.35:8081'
        # 关闭原型不需要的内置组件，加快启动、降低内存
        gitlab_rails['gitlab_shell_ssh_port'] = 8082
        prometheus_monitoring['enable'] = false
        gitlab_rails['prometheus_address'] = ''
        # 关注册：账号一律管理员开通（设计 §4.3 统一开通口径），为阶段1接 LDAP 留干净底子
        gitlab_rails['gitlab_signup_enabled'] = false
        gitlab_rails['gitlab_default_can_create_group'] = false
        sidekiq['max_concurrency'] = 10
        # 降低资源占用
        puma['worker_processes'] = 2
        # LDAP 对接是阶段 1 正式实施项，原型用 root 本地账号验证
    ports:
      - "8081:8081"   # web
      - "8082:22"     # ssh
    volumes:
      - ./config:/etc/gitlab
      - ./logs:/var/log/gitlab
      - ./data:/var/opt/gitlab
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
    networks:
      - frm-net

  gitlab-runner:
    # 版本与 GitLab 主版本对齐（19.3.1），钉版纪律同 GitLab（ADR-0021）
    image: gitlab/gitlab-runner:v19.3.1
    container_name: frm-runner
    restart: unless-stopped
    volumes:
      - ./runner-config:/etc/gitlab-runner
      # shell executor 的 CI job 内跑 docker CLI：build/push/pull 即宿主 docker 操作，
      # Harbor 信任只需配宿主 daemon 一处（二阶段设计 §3 实测口径）
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "125"   # 宿主 docker.sock 属组 GID（以宿主实际为准，本原型机为 125）
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    networks:
      - frm-net
    # 注册在 GitLab 就绪后进行（见 docs/tutorials/ops.html#run），此处先起容器

  # ── 二阶段：MinIO 对象存储（§6.4 大文件归宿 / §7.2 现场数据通道）──
  # 端口避开 pih 项目已占用的 9000/9001：9002 API、9003 Console
  # 注：容器内显式监听 9002（--address），否则默认 9000 与端口映射 9002:9002 不符；
  #     healthcheck 相应用 curl 探测 9002（mc 的内置 local 别名固定指向 localhost:9000，
  #     --address 变更后 "mc ready local" 会无限重试，实测如此）
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z   # 钉实测版本，离线机房可复现
    container_name: frm-minio
    restart: unless-stopped
    command: server /data --address ":9002" --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: "Excavator#2026Proto"
    ports:
      - "9002:9002"   # S3 API（CI / mc 用）
      - "9003:9003"   # Web Console（截图用）
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
    networks:
      - frm-net

  # 一次性初始化：建三桶（幂等，重跑无害）
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: frm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://frm-minio:9002 minioadmin 'Excavator#2026Proto' &&
      mc mb -p local/dataset-model local/field-dropzone local/training-output &&
      echo 'buckets ready'"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - frm-net
    restart: "no"

networks:
  frm-net:
    driver: bridge
